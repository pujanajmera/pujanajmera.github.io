<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV | Pujan Ajmera</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      padding: 2rem;
      max-width: 980px;
      min-height: 100vh;
      line-height: 1.55;
      color: #111;
      background: #f8f9fb;
    }

    header {
      margin-bottom: 1.5rem;
    }

    nav {
      margin-bottom: 1.5rem;
    }

    nav a {
      margin-right: 1rem;
      color: #0366d6;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }

    section {
      background: #fff;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      margin-bottom: 1.5rem;
    }

    .pdf-frame {
      display: block;
      width: 100%;
      height: min(88vh, 1100px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      background: #eef2f6;
    }

    .pdf-links {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #555;
    }

    .pdf-links a {
      color: #0366d6;
      text-decoration: none;
    }

    .pdf-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .pdf-frame {
        height: min(78vh, 900px);
      }
    }
  </style>
  <script src="site-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var showCV = !window.SITE_FLAGS || window.SITE_FLAGS.showCV !== false;
      if (!showCV) {
        document.querySelectorAll('.cv-link').forEach(function (link) {
          link.remove();
        });
      }
    });
  </script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="publications.html">Publications</a>
    <a href="repos.html">Repositories</a>
    <a class="cv-link" href="cv.html">CV</a>
  </nav>

  <header>
    <h1>Curriculum Vitae</h1>
  </header>

  <section>
      <object class="pdf-frame" data="documents/CV.pdf#view=FitH" type="application/pdf">
        <iframe class="pdf-frame" src="documents/CV.pdf#view=FitH" title="Pujan Ajmera CV PDF"></iframe>
      </object>
    </section>
</body>
</html>
